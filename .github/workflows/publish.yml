# Publish Az's Companions jars from a GitHub Release to Modrinth + CurseForge.
# Docs: docs/PUBLISHING.md
#
# Required repo secrets (prefer PUBLISH_* names; legacy names still work):
#   PUBLISH_MODRINTH_TOKEN (or MODRINTH_TOKEN)
#   PUBLISH_CURSEFORGE_TOKEN (or CURSEFORGE_TOKEN)
# Required repo variables (Az's Companions project IDs / slug azs-companions):
#   MODRINTH_PROJECT_ID
#   CURSEFORGE_PROJECT_ID
#
# Triggers: release published, or manual workflow_dispatch with a tag (e.g. v1.0.7).

name: Publish Modrinth / CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to publish (e.g. v1.0.7)"
        required: true
        default: "v1.0.7"
      version_type:
        description: "Modrinth/CurseForge version type"
        type: choice
        options: [release, beta, alpha]
        default: release

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      ready: ${{ steps.gate.outputs.ready }}
      skip_reason: ${{ steps.gate.outputs.skip_reason }}
      has_modrinth: ${{ steps.gate.outputs.has_modrinth }}
      has_curseforge: ${{ steps.gate.outputs.has_curseforge }}
    steps:
      - name: Resolve tag / version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "::error::No release tag. Publish a GitHub Release or pass workflow_dispatch input 'tag'."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing tag=$TAG version=$VERSION"

      - name: Check secrets and project IDs
        id: gate
        shell: bash
        env:
          # Prefer PUBLISH_* secrets; fall back to legacy names if unset.
          MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN || secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN || secrets.CURSEFORGE_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          set -euo pipefail
          reasons=()
          has_mr=false
          has_cf=false

          if [[ -n "${MODRINTH_TOKEN}" && -n "${MODRINTH_PROJECT_ID}" ]]; then
            has_mr=true
          else
            [[ -z "${MODRINTH_TOKEN}" ]] && reasons+=("secret PUBLISH_MODRINTH_TOKEN (or MODRINTH_TOKEN)")
            [[ -z "${MODRINTH_PROJECT_ID}" ]] && reasons+=("variable MODRINTH_PROJECT_ID")
          fi

          if [[ -n "${CURSEFORGE_TOKEN}" && -n "${CURSEFORGE_PROJECT_ID}" ]]; then
            has_cf=true
          else
            [[ -z "${CURSEFORGE_TOKEN}" ]] && reasons+=("secret PUBLISH_CURSEFORGE_TOKEN (or CURSEFORGE_TOKEN)")
            [[ -z "${CURSEFORGE_PROJECT_ID}" ]] && reasons+=("variable CURSEFORGE_PROJECT_ID")
          fi

          echo "has_modrinth=$has_mr" >> "$GITHUB_OUTPUT"
          echo "has_curseforge=$has_cf" >> "$GITHUB_OUTPUT"

          if [[ "$has_mr" == true || "$has_cf" == true ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "skip_reason=" >> "$GITHUB_OUTPUT"
            echo "Ready - Modrinth=$has_mr CurseForge=$has_cf"
          else
            joined=$(IFS=', '; echo "${reasons[*]}")
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=$joined" >> "$GITHUB_OUTPUT"
            echo "::warning::Publish skipped - missing: $joined. See docs/PUBLISHING.md"
          fi

  publish:
    name: Upload ${{ matrix.edition }} ${{ matrix.loader }} ${{ matrix.mc }}
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - jar: azscompanions-neoforge-{VERSION}+1.21.1.jar
            loader: neoforge
            mc: "1.21.1"
            java: "21"
            edition: standalone
            version_suffix: 1.21.1-neoforge
            deps: ""
          - jar: azscompanions-neoforge-cci-{VERSION}+1.21.1.jar
            loader: neoforge
            mc: "1.21.1"
            java: "21"
            edition: cci
            version_suffix: 1.21.1-neoforge-cci
            deps: |
              content-creator-integration(required){modrinth:6Z8wT5tM}{curseforge:302296}
              ichunutil(required){modrinth:W6ROj0Hl}{curseforge:229060}
          - jar: azscompanions-fabric-{VERSION}+1.21.1.jar
            loader: fabric
            mc: "1.21.1"
            java: "21"
            edition: standalone
            version_suffix: 1.21.1-fabric
            deps: |
              fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          - jar: azscompanions-fabric-cci-{VERSION}+1.21.1.jar
            loader: fabric
            mc: "1.21.1"
            java: "21"
            edition: cci
            version_suffix: 1.21.1-fabric-cci
            deps: |
              fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
              content-creator-integration(required){modrinth:6Z8wT5tM}{curseforge:302296}
              ichunutil(required){modrinth:W6ROj0Hl}{curseforge:229060}
          - jar: azscompanions-neoforge-{VERSION}+1.21.5.jar
            loader: neoforge
            mc: "1.21.5"
            java: "21"
            edition: standalone
            version_suffix: 1.21.5-neoforge
            deps: ""
          - jar: azscompanions-neoforge-cci-{VERSION}+1.21.5.jar
            loader: neoforge
            mc: "1.21.5"
            java: "21"
            edition: cci
            version_suffix: 1.21.5-neoforge-cci
            deps: |
              content-creator-integration(required){modrinth:6Z8wT5tM}{curseforge:302296}
              ichunutil(required){modrinth:W6ROj0Hl}{curseforge:229060}
          - jar: azscompanions-fabric-{VERSION}+1.21.5.jar
            loader: fabric
            mc: "1.21.5"
            java: "21"
            edition: standalone
            version_suffix: 1.21.5-fabric
            deps: |
              fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          - jar: azscompanions-fabric-cci-{VERSION}+1.21.5.jar
            loader: fabric
            mc: "1.21.5"
            java: "21"
            edition: cci
            version_suffix: 1.21.5-fabric-cci
            deps: |
              fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
              content-creator-integration(required){modrinth:6Z8wT5tM}{curseforge:302296}
              ichunutil(required){modrinth:W6ROj0Hl}{curseforge:229060}
          - jar: azscompanions-forge-{VERSION}+1.20.1.jar
            loader: forge
            mc: "1.20.1"
            java: "17"
            edition: standalone
            version_suffix: 1.20.1-forge
            deps: ""
          - jar: azscompanions-forge-cci-{VERSION}+1.20.1.jar
            loader: forge
            mc: "1.20.1"
            java: "17"
            edition: cci
            version_suffix: 1.20.1-forge-cci
            deps: |
              content-creator-integration(required){modrinth:6Z8wT5tM}{curseforge:302296}
              ichunutil(required){modrinth:W6ROj0Hl}{curseforge:229060}
          - jar: azscompanions-fabric-{VERSION}+1.20.1.jar
            loader: fabric
            mc: "1.20.1"
            java: "17"
            edition: standalone
            version_suffix: 1.20.1-fabric
            deps: |
              fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
          - jar: azscompanions-fabric-cci-{VERSION}+1.20.1.jar
            loader: fabric
            mc: "1.20.1"
            java: "17"
            edition: cci
            version_suffix: 1.20.1-fabric-cci
            deps: |
              fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
              content-creator-integration(required){modrinth:6Z8wT5tM}{curseforge:302296}
              ichunutil(required){modrinth:W6ROj0Hl}{curseforge:229060}
          - jar: azscompanions-neoforge-{VERSION}+26.1.2.jar
            loader: neoforge
            mc: "26.1.2"
            java: "25"
            edition: standalone
            version_suffix: 26.1.2-neoforge
            deps: ""
          - jar: azscompanions-neoforge-{VERSION}+26.2.jar
            loader: neoforge
            mc: "26.2"
            java: "25"
            edition: standalone
            version_suffix: 26.2-neoforge
            deps: ""

    steps:
      - name: Download release jar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          JAR_TEMPLATE: ${{ matrix.jar }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="${JAR_TEMPLATE//\{VERSION\}/$VERSION}"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          mkdir -p dist
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$JAR" \
            --dir dist
          test -f "dist/$JAR"
          ls -lh "dist/$JAR"

      - name: Compose display name / version id
        id: names
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MC: ${{ matrix.mc }}
          LOADER: ${{ matrix.loader }}
          EDITION: ${{ matrix.edition }}
          SUFFIX: ${{ matrix.version_suffix }}
        run: |
          set -euo pipefail
          if [[ "$EDITION" == "cci" ]]; then
            TITLE="${VERSION} - ${LOADER} CCI ${MC}"
          else
            TITLE="${VERSION} - ${LOADER} ${MC}"
          fi
          VER_ID="${VERSION}+${SUFFIX}"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "version_id=$VER_ID" >> "$GITHUB_OUTPUT"

      - name: Publish (Modrinth / CurseForge)
        uses: Kira-NT/mc-publish@v3.3
        with:
          files: dist/${{ env.JAR }}
          name: ${{ steps.names.outputs.title }}
          version: ${{ steps.names.outputs.version_id }}
          version-type: ${{ inputs.version_type || 'release' }}
          changelog: ${{ github.event.release.body || format('Az Companions {0}', needs.prepare.outputs.version) }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.mc }}
          game-version-filter: none
          java: ${{ matrix.java }}
          dependencies: ${{ matrix.deps }}
          retry-attempts: 3
          retry-delay: 15000
          fail-mode: fail
          modrinth-id: ${{ needs.prepare.outputs.has_modrinth == 'true' && vars.MODRINTH_PROJECT_ID || '' }}
          modrinth-token: ${{ needs.prepare.outputs.has_modrinth == 'true' && (secrets.PUBLISH_MODRINTH_TOKEN || secrets.MODRINTH_TOKEN) || '' }}
          curseforge-id: ${{ needs.prepare.outputs.has_curseforge == 'true' && vars.CURSEFORGE_PROJECT_ID || '' }}
          curseforge-token: ${{ needs.prepare.outputs.has_curseforge == 'true' && (secrets.PUBLISH_CURSEFORGE_TOKEN || secrets.CURSEFORGE_TOKEN) || '' }}

  summary:
    name: Summary
    needs: [prepare, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        shell: bash
        env:
          READY: ${{ needs.prepare.outputs.ready }}
          SKIP: ${{ needs.prepare.outputs.skip_reason }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          HAS_MR: ${{ needs.prepare.outputs.has_modrinth }}
          HAS_CF: ${{ needs.prepare.outputs.has_curseforge }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          {
            echo "## Publish $TAG ($VERSION)"
            echo
            if [[ "$READY" != "true" ]]; then
              echo "**Status:** skipped - missing \`$SKIP\`"
              echo
              echo "Configure secrets/variables per docs/PUBLISHING.md, then re-run this workflow."
            else
              echo "**Status:** publish job result = \`$PUBLISH_RESULT\`"
              echo
              echo "| Platform | Enabled |"
              echo "|----------|---------|"
              echo "| Modrinth | \`$HAS_MR\` |"
              echo "| CurseForge | \`$HAS_CF\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
