modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Azturax/Az_s_Companions/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Az"
description='''
Az's Companions (CCI edition) for Minecraft 1.21.1 NeoForge.

Same companion gameplay as the standalone jar, plus hard dependency on
iChun's Content Creator Integration (CCI) and iChunUtil for stream-event
interop (IMC outcomes, example streamer configs, companion greet/say/follow).

Install this jar OR the standalone NeoForge jar — not both.
Requires Content Creator Integration and iChunUtil.
All characters are explicitly adult, wholesome, and non-sexual.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
