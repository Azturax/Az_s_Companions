plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

base {
    archivesName = "${rootProject.archives_name}-neoforge-cci"
}

version = "${rootProject.mod_version}+${rootProject.minecraft_version}"
group = rootProject.mod_group_id

def commonResourcesDir = rootProject.file('common/src/main/resources')
def neoforgeProject = project(':neoforge')
def neoforgeSrc = neoforgeProject.file('src/main/java')
def neoforgeResources = neoforgeProject.file('src/main/resources')
def neoforgeGenerated = neoforgeProject.file('src/generated/resources')

sourceSets.main.java {
    srcDir(neoforgeSrc)
    srcDir('src/main/java')
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir(neoforgeGenerated)
    srcDir(neoforgeResources)
    srcDir(commonResourcesDir)
    srcDir('src/main/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = rootProject.neo_version

    parchment {
        mappingsVersion = rootProject.parchment_mappings_version
        minecraftVersion = rootProject.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', rootProject.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', rootProject.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':common')
    compileOnly "info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1"
    // CCI + iChunUtil (NeoForge 1.21 / 1.21.1) via Modrinth Maven version IDs.
    implementation "maven.modrinth:content-creator-integration:${rootProject.cci_modrinth_version_id}"
    implementation "maven.modrinth:ichunutil:${rootProject.ichunutil_modrinth_version_id}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar', Jar).configure {
    from(project(':common').sourceSets.main.output.classesDirs)
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neo_version            : rootProject.neo_version,
            neo_version_range      : rootProject.neo_version_range,
            loader_version_range   : rootProject.loader_version_range,
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name + " (CCI)",
            mod_license            : rootProject.mod_license,
            mod_version            : rootProject.mod_version,
            cci_version_range      : rootProject.cci_version_range,
            ichunutil_version_range: rootProject.ichunutil_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
