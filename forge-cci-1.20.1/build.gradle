// Minecraft 1.20.1 Forge CCI edition — points at :forge-1.20.1 + CCI/iChunUtil pins.
// NeoForge has NO 1.20.1 line — this is Forge 47.4.x only.
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
    id 'idea'
}

base {
    archivesName = "${rootProject.archives_name}-forge-cci"
}

version = "${rootProject.mod_version}+${rootProject.minecraft_1_20_1_version}"
group = rootProject.mod_group_id

def commonResourcesDir = rootProject.file('common/src/main/resources')
def forgeProject = project(':forge-1.20.1')
def forgeSrc = forgeProject.file('src/main/java')
def forgeResources = forgeProject.file('src/main/resources')
def forgeGenerated = forgeProject.file('src/generated/resources')

sourceSets.main.java {
    srcDir(forgeSrc)
    srcDir('src/main/java')
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir(forgeGenerated)
    srcDir(forgeResources)
    srcDir(commonResourcesDir)
    srcDir('src/main/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

legacyForge {
    version = "${rootProject.minecraft_1_20_1_version}-${rootProject.forge_1_20_1_version}"
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${rootProject.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':common')
    // JourneyMap API omitted on 1.20.1 (JVM 21+)
    modImplementation "maven.modrinth:content-creator-integration:${rootProject.cci_1_20_1_forge_modrinth_version_id}"
    modImplementation "maven.modrinth:ichunutil:${rootProject.ichunutil_1_20_1_forge_modrinth_version_id}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar', Jar).configure {
    from(project(':common').sourceSets.main.output.classesDirs)
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : rootProject.minecraft_1_20_1_version,
            minecraft_version_range: rootProject.minecraft_1_20_1_version_range,
            forge_version          : rootProject.forge_1_20_1_version,
            forge_version_range    : '[47,)',
            loader_version_range   : '[47,)',
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name + " (CCI)",
            mod_license            : rootProject.mod_license,
            mod_version            : rootProject.mod_version,
            cci_version_range      : rootProject.cci_version_range,
            ichunutil_version_range: rootProject.ichunutil_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
