license="${mod_license}"
issueTrackerURL="https://github.com/Azturax/Az_s_Companions/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Az"
description='''
Az's Companions adds wholesome adult AI companions for Minecraft.
Find a Companion Charm, summon your companion, customize them, chat nearby,
and let them follow you home to a bed.

NeoForge jar for Minecraft 26.2 (standalone — no CCI build for this line yet).
All characters are explicitly adult, wholesome, and non-sexual.
One companion per player on multiplayer servers.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional proximity voice (Simple Voice Chat) — soft-dep
[[dependencies.${mod_id}]]
modId="voicechat"
type="optional"
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="voicemod"
type="optional"
versionRange="*"
ordering="NONE"
side="BOTH"
