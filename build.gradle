plugins {
    id 'java'
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.architectury.dev/" }
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        maven { url = "https://maven.blamejared.com/" }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build Fabric + NeoForge jars for 1.21.1 (CCI soft-compat included)'
    dependsOn ':fabric:build', ':neoforge:build'
}

tasks.register('buildAll215') {
    group = 'build'
    description = 'Build Fabric + NeoForge jars for Minecraft 1.21.5 (CCI soft-compat included)'
    dependsOn ':fabric-21.5:build', ':neoforge-21.5:build'
}

tasks.register('buildAll1201') {
    group = 'build'
    description = 'Build Fabric + Forge jars for Minecraft 1.20.1 (CCI soft-compat included; no NeoForge 20.1)'
    dependsOn ':fabric-1.20.1:build', ':forge-1.20.1:build'
}

tasks.register('buildNeoForge26') {
    group = 'build'
    description = 'Build NeoForge standalone jar for Minecraft 26.2 (no CCI available)'
    dependsOn ':neoforge-26:build'
}

tasks.register('buildNeoForge261') {
    group = 'build'
    description = 'Build NeoForge standalone jar for Minecraft 26.1.2 (no CCI available)'
    dependsOn ':neoforge-26-1:build'
}

tasks.register('runFabricClient') {
    group = 'fabric'
    dependsOn ':fabric:runClient'
}

tasks.register('runNeoForgeClient') {
    group = 'neoforge'
    dependsOn ':neoforge:runClient'
}

tasks.register('runNeoForge26Client') {
    group = 'neoforge'
    description = 'Run NeoForge client for Minecraft 26.2 (:neoforge-26)'
    dependsOn ':neoforge-26:runClient'
}

tasks.register('runNeoForge261Client') {
    group = 'neoforge'
    description = 'Run NeoForge client for Minecraft 26.1.2 (:neoforge-26-1)'
    dependsOn ':neoforge-26-1:runClient'
}
