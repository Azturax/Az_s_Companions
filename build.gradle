plugins {
    id 'java'
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.architectury.dev/" }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build Fabric and NeoForge jars'
    dependsOn ':fabric:build', ':neoforge:build'
}

tasks.register('runFabricClient') {
    group = 'fabric'
    dependsOn ':fabric:runClient'
}

tasks.register('runNeoForgeClient') {
    group = 'neoforge'
    dependsOn ':neoforge:runClient'
}
