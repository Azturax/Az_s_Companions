modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Azturax/Az_s_Companions/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Az"
description='''
Az's Companions adds wholesome adult AI companions for Minecraft.
Find a Companion Charm, summon your companion, customize them, chat nearby,
and let them follow you home to a bed.

Forge jar for Minecraft 1.20.1 (no NeoForge 20.1 line) (Fabric jar available separately).
All characters are explicitly adult, wholesome, and non-sexual.
One companion per player on multiplayer servers.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
# Production pin: NeoForge 21.1.x (Minecraft 1.21.1). NeoForge 26.2 is a separate port.
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
# Production pin: Minecraft 1.20.1 only (see docs/MULTI_VERSION.md for 26.2 plans)
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional map mods — soft-dep (mod loads without them)
[[dependencies.${mod_id}]]
modId="journeymap"
mandatory=false
versionRange="*"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="xaerominimap"
mandatory=false
versionRange="*"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="xaeroworldmap"
mandatory=false
versionRange="*"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ftbchunks"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# Optional hosted-world / invite-friends mods (Essential, e4mc, World Host)
[[dependencies.${mod_id}]]
modId="essential"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="e4mc"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="world-host"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

# Optional dynamic lighting (client) — soft-dep
[[dependencies.${mod_id}]]
modId="lambdynlights"
mandatory=false
versionRange="*"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ryoamiclights"
mandatory=false
