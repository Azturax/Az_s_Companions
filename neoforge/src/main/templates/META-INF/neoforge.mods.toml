modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Azturax/Az_s_Companions/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Az"
description='''
Az's Companions adds wholesome adult AI companions for Minecraft.
Find a Companion Charm, summon your companion, customize them, chat nearby,
and let them follow you home to a bed.

NeoForge jar for Minecraft 1.21.1 (Fabric jar available separately).
All characters are explicitly adult, wholesome, and non-sexual.
One companion per player on multiplayer servers.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
# Accept NeoForge 21.1.x (MC 1.21.1) through 26.2.x (MC 26.2)
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
# Accept Minecraft 1.21.1 through 26.2
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
