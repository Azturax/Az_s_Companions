pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'azscompanions'

include 'common'
include 'fabric'
include 'neoforge'
include 'neoforge-26'
include 'neoforge-26-1'
include 'neoforge-21.5'
include 'fabric-21.5'
include 'fabric-1.20.1'
include 'forge-1.20.1'
// CCI soft-compat ships inside the main jars above (no separate *-cci modules).
